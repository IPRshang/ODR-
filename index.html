let _demoMode = false;

// 检测后端是否可用（首次请求时检测）
async function _checkBackend() {
  if (_demoMode) return false;
  try {
    const res = await fetch('/api/health', {signal: AbortSignal.timeout(3000)});
    if (res.ok) { _demoMode = false; return true; }
  } catch(e) {}
  _demoMode = true;
  _showDemoBanner();
  return false;
}

function _showDemoBanner() {
  if (document.getElementById('demo-banner')) return;
  const banner = document.createElement('div');
  banner.id = 'demo-banner';
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:linear-gradient(90deg,#ff6b35,#f7931e);color:#fff;text-align:center;font-size:13px;padding:6px;font-weight:600';
  banner.innerHTML = '演示模式 - 后端未连接，显示示例数据。如需完整功能请运行 Flask 后端。';
  document.body.insertBefore(banner, document.body.firstChild);
  document.body.style.paddingTop = '32px';
}

// 伪造数据路由匹配
function _matchDemoRoute(url) {
  // 精确匹配
  if (DEMO_DATA[url]) return DEMO_DATA[url];
  // /api/cases?xxx → 案件列表
  if (url.startsWith('/api/cases?')) return DEMO_DATA['/api/cases'];
  // /api/cases/{id} → 单个案件
  const caseMatch = url.match(/^\/api\/cases\/([a-f0-9]+)/);
  if (caseMatch) {
    const c = DEMO_DATA['/api/cases/a1'];
    return {...c, id: caseMatch[1], case_no: 'WQ'+caseMatch[1]};
  }
  // /api/patents?xxx → 专利列表
  if (url.startsWith('/api/patents')) return DEMO_DATA['/api/patents'];
  // /api/dashboard/activities
  if (url.startsWith('/api/dashboard/activities')) return DEMO_DATA['/api/dashboard/activities'];
  return null;
}

// ==========================================
// API 工具（带后端检测回退）
// ==========================================
const _origFetch = window.fetch;
window.fetch = async function(url, opts) {
  const isApi = typeof url === 'string' && url.startsWith('/api/');
  if (!isApi) return _origFetch.apply(this, arguments);

  try {
    const res = await _origFetch.call(this, url, opts);
    if (res.ok) return res;
    throw new Error('HTTP ' + res.status);
  } catch(e) {
    // 后端不可用，返回演示数据
    if (!_demoMode) { _demoMode = true; _showDemoBanner(); }

    const demo = _matchDemoRoute(url);
    if (demo !== null) {
      return {
        ok: true, status: 200,
        json: async () => demo,
        text: async () => JSON.stringify(demo)
      };
    }
    // POST/PUT 操作在演示模式下返回成功
    if (opts && (opts.method === 'POST' || opts.method === 'PUT')) {
      return {
        ok: true, status: 200,
        json: async () => ({success:true, id:'demo_'+Date.now()}),
        text: async () => '{"success":true}'
      };
    }
    // 无匹配数据
    return {
      ok: true, status: 200,
      json: async () => [],
      text: async () => '[]'
    };
  }
};

const API = {
  async get(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  },
  async post(url, data) {
    const res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  },
  async put(url, data) {
    const res = await fetch(url, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }
};

let currentCaseId = null;

function navigate(page, params) {
  currentPage = page;
  if (params) currentCaseId = params.caseId;
  
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navItem = document.querySelector(`[data-page="${page}"]`);
  if (navItem) navItem.classList.add('active');
  
  renderPage(page, params);
}

function renderPage(page, params) {
  const container = document.getElementById('page-content');
  switch(page) {
    case 'dashboard': renderDashboard(container); break;
    case 'case-list': renderCaseList(container); break;
    case 'new-case': renderNewCaseForm(container); break;
    case 'case-detail': renderCaseDetail(container, params); break;
    case 'patents': renderPatentLibrary(container); break;
    case 'competitors': renderCompetitorMonitor(container); break;
    case 'deadlines': renderDeadlineMonitor(container); break;
    case 'patsnap': renderPatSnapPage(container); break;
    default: container.innerHTML = '<div class="empty-state"><h3>页面未找到</h3></div>';
  }
}

// ==========================================
// Toast 通知
// ==========================================
function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => { toast.remove(); }, 3000);
}

// ==========================================
// 模态框
// ==========================================
function openModal(title, bodyHTML, footerHTML = '') {
  const overlay = document.getElementById('modal-overlay');
  const box = document.getElementById('modal-box');
  box.innerHTML = `
    <div class="modal-header">
      <h2>${title}</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">${bodyHTML}</div>
    ${footerHTML ? `<div class="modal-footer">${footerHTML}</div>` : ''}
  `;
  overlay.classList.add('show');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

// 点击遮罩关闭
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

  pending: '待处理', in_progress: '处理中', completed: '已完成', rejected: '已驳回'
};
const priorityLabels = { high: '高', normal: '中', low: '低' };
const priorityBadges = { high: 'badge-danger', normal: 'badge-warning', low: 'badge-gray' };

function stageBadge(stage) {
  const colors = {1:'badge-primary',2:'badge-warning',3:'badge-warning',4:'badge-primary',5:'badge-primary',6:'badge-success'};
  return `<span class="badge ${colors[stage]||'badge-gray'}">${stageNames[stage]}</span>`;
}

function statusBadge(status) {
  const map = { pending:'badge-gray', in_progress:'badge-warning', completed:'badge-success', rejected:'badge-danger' };
  return `<span class="badge ${map[status]||'badge-gray'}">${stageStatusLabels[status]||status}</span>`;
}

function formatTime(t) {
  if (!t) return '-';
  return t.replace('T', ' ').substring(0, 16);
}

function renderStageChart(sd) {
  const stages = [
    {name:'线索提报', count:sd.stage_1||0, color:'#1a73e8'},
    {name:'初步评估', count:sd.stage_2||0, color:'#f59e0b'},
    {name:'决策审批', count:sd.stage_3||0, color:'#f59e0b'},
    {name:'证据保全', count:sd.stage_4||0, color:'#1a73e8'},
    {name:'侵权比对', count:sd.stage_5||0, color:'#1a73e8'},
    {name:'法律行动', count:sd.stage_6||0, color:'#0d9488'},
  ];
  const max = Math.max(...stages.map(s=>s.count), 1);
  
  return stages.map(s => `
    <div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px">
        <span>${s.name}</span>
        <strong>${s.count}</strong>
      </div>
      <div style="background:var(--gray-200);border-radius:4px;height:8px;overflow:hidden">
        <div style="background:${s.color};height:100%;width:${(s.count/max*100).toFixed(1)}%;border-radius:4px;transition:width 0.5s ease"></div>
      </div>
    </div>
  `).join('');
}

async function filterCases() {
  const container = document.getElementById('case-table-container');
  if (!container) return;
  
  const keyword = document.getElementById('case-search')?.value || '';
  const stage = document.getElementById('stage-filter')?.value || '';
  const status = document.getElementById('status-filter')?.value || '';
  
  const params = new URLSearchParams();
  if (keyword) params.set('keyword', keyword);
  if (stage) params.set('stage', stage);
  if (status) params.set('status', status);
  
  try {
    const cases = await API.get(`/api/cases?${params}`);
    if (cases.length === 0) {
      container.innerHTML = '<div class="card-body"><div class="empty-state"><div class="empty-icon">📭</div><h3>暂无案件</h3><p>点击"新建案件"开始提报线索</p></div></div>';

async function submitLead(e) {
  e.preventDefault();
  const form = e.target;
  const data = Object.fromEntries(new FormData(form));
  const attachments = data.lead_attachments
    ? data.lead_attachments.split('\n').map(s=>s.trim()).filter(s=>s)
    : [];
  
  try {
    const result = await API.post('/api/cases', {
      ...data,
      lead_attachments: attachments
    });
    showToast(`✅ 线索提报成功！案件编号：${result.case_no}`);
    navigate('case-detail', { caseId: result.id });
  } catch(err) {
    showToast('❌ 提报失败: ' + err.message, 'error');
  }
}

function renderWorkflowSteps(c) {
  const stages = [
    {step:1, name:'线索提报', desc:'销售/研发'},
    {step:2, name:'初步评估', desc:'IP部'},
    {step:3, name:'决策审批', desc:'管理层'},
    {step:4, name:'证据保全', desc:'IP部/法务'},
    {step:5, name:'侵权比对', desc:'IP部'},
    {step:6, name:'法律行动', desc:'法务/IP部'},
  ];
  
  // 判断各阶段状态
  const completed = new Set();
  if (c.current_stage >= 1) completed.add(1);
  if (c.assessment_result) completed.add(2);
  if (c.approval_decision) completed.add(3);
  if (c.evidence_status === 'in_progress' || c.evidence_status === 'completed') completed.add(4);
  if (c.comparison_status === 'completed') completed.add(5);
  
  return `
    <div class="workflow-steps">
      ${stages.map(s => {
        let cls = '';
        if (s.step === c.current_stage && c.stage_status !== 'completed') cls = 'active';
        else if (completed.has(s.step) || s.step < c.current_stage) cls = 'completed';
        return `
          <div class="workflow-step ${cls}">
            <div class="step-number">${cls==='completed' ? '✓' : s.step}</div>
            <div class="step-title">${s.name}</div>
            <div class="step-desc">${s.desc}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderAttachments(attachmentsStr) {
  try {
    const atts = typeof attachmentsStr === 'string' ? JSON.parse(attachmentsStr) : (attachmentsStr || []);
    if (!atts.length) return '';
    return `
      <div style="margin-top:12px">
        <strong>附件：</strong>
        <ul class="file-list">
          ${atts.map(a => `<li><span class="file-icon">🔗</span> <a href="${a}" target="_blank">${a}</a></li>`).join('')}
        </ul>
      </div>
    `;
  } catch { return ''; }
}

// ==========================================
// 案件详情 - 标签页切换
// ==========================================
async function switchCaseTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');
  
  const content = document.getElementById('case-tab-content');
  if (!content || !currentCaseId) return;
  
  try {
    const c = await API.get(`/api/cases/${currentCaseId}`);
    
    switch(tab) {
      case 'timeline':
        content.innerHTML = (c.timeline || []).length === 0
          ? '<div class="empty-state"><h3>暂无动态</h3></div>'
          : `<div class="timeline">${c.timeline.map(t => `
            <div class="timeline-item">
              <div class="tl-time">${formatTime(t.created_at)} · ${t.operator}</div>
              <div class="tl-title">${t.event_type === 'lead_submit' ? '📥' : t.event_type === 'assessment' ? '🔍' : t.event_type === 'approval' ? '⚖️' : t.event_type === 'evidence' ? '📎' : t.event_type === 'comparison' ? '📊' : t.event_type === 'legal' ? '⚖️' : t.event_type === 'document' ? '📄' : '📌'} ${t.event_title}</div>
              <div class="tl-detail">${t.event_detail || ''}</div>
            </div>
          `).join('')}</div>`;
        break;
        
      case 'evidence':
        content.innerHTML = (c.evidence || []).length === 0
          ? `<div class="empty-state"><h3>暂无证据</h3><p>点击"添加证据"上传证据材料</p>
             <button class="btn btn-primary btn-sm" style="margin-top:12px" onclick="openEvidenceForm()">📎 添加证据</button></div>`
          : `<ul class="file-list">${c.evidence.map(e => `
            <li>
              <span class="file-icon">${e.file_type === 'pdf' ? '📕' : e.file_type?.startsWith('image') || e.file_type === 'jpg' ? '🖼️' : e.file_type?.startsWith('video') || e.file_type === 'mp4' ? '🎬' : '📎'}</span>
              <div style="flex:1">
                <strong>${e.file_name}</strong>
                <div style="font-size:12px;color:var(--gray-500)">${e.evidence_type} · ${e.uploader || '未知'} · ${formatTime(e.created_at)}</div>
                ${e.description ? `<div style="font-size:12px;color:var(--gray-400)">${e.description}</div>` : ''}
              </div>
            </div>
          `).join('')}</ul>
          <button class="btn btn-outline btn-sm" style="margin-top:12px" onclick="openEvidenceForm()">📎 继续添加</button>`;
        break;
        
      case 'documents':
        content.innerHTML = (c.documents || []).length === 0
          ? `<div class="empty-state"><h3>暂无文档</h3><p>可在此归档《侵权比对报告》《维权策略方案》等文档</p>
             <button class="btn btn-outline btn-sm" style="margin-top:12px" onclick="openDocumentForm()">📄 添加文档</button></div>`
          : `<ul class="file-list">${c.documents.map(d => `
            <li>
              <span class="file-icon">📄</span>
              <div style="flex:1">
                <strong>${d.doc_name}</strong>
                <div style="font-size:12px;color:var(--gray-500)">${d.doc_type} · ${d.doc_category} · ${d.uploader || '未知'} · ${formatTime(d.created_at)}</div>
                ${d.description ? `<div style="font-size:12px;color:var(--gray-400)">${d.description}</div>` : ''}
              </div>
            </div>
          `).join('')}</ul>
          <button class="btn btn-outline btn-sm" style="margin-top:12px" onclick="openDocumentForm()">📄 添加文档</button>`;
        break;
        
      case 'deadlines':
        content.innerHTML = (c.deadlines || []).length === 0
          ? `<div class="empty-state"><h3>暂无期限</h3><p>为案件关键节点设置期限提醒</p>
             <button class="btn btn-outline btn-sm" style="margin-top:12px" onclick="openDeadlineForm()">⏰ 添加期限</button></div>`
          : `<table>
            <thead><tr><th>期限名称</th><th>类型</th><th>截止日期</th><th>状态</th><th>负责人</th><th>提醒</th></tr></thead>
            <tbody>${c.deadlines.map(d => {
              const isUrgent = new Date(d.due_date) <= new Date(Date.now() + 7*86400000);
              return `
              <tr>
                <td><strong>${d.title}</strong></td>
                <td>${d.deadline_type}</td>
                <td style="${isUrgent ? 'color:var(--danger);font-weight:600' : ''}">${d.due_date}</td>
                <td><span class="badge ${d.status==='completed'?'badge-success':isUrgent?'badge-danger':'badge-warning'}">${d.status==='completed'?'已完成':isUrgent?'即将到期':'待处理'}</span></td>
                <td>${d.responsible_person || '-'}</td>
                <td>提前${d.remind_days_before}天</td>
              </tr>`;
            }).join('')}</tbody></table>
            <button class="btn btn-outline btn-sm" style="margin-top:12px" onclick="openDeadlineForm()">⏰ 添加期限</button>`;
        break;
    }
  } catch(e) {
    content.innerHTML = `<div class="empty-state"><h3>加载失败</h3><p>${e.message}</p></div>`;
  }
}

async function savePatSnapKey() {
  const key = document.getElementById('patsnap-apikey').value.trim();
  if (!key) return showToast('请输入 API Key', 'warning');
  if (!key.startsWith('sk-')) return showToast('API Key 应以 sk- 开头', 'warning');
  
  try {
    const resp = await fetch('/api/patsnap/config', {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({api_key: key})
    });
    const data = await resp.json();
    if (data.success) {
      showToast('API Key 已保存');
      renderPatSnapPage(document.getElementById('page-content'));
    }
  } catch(e) {
    showToast('保存失败: ' + e.message, 'error');
  }
}

async function searchPatSnap() {
  const query = document.getElementById('patsnap-query').value.trim();
  if (!query) return showToast('请输入搜索内容', 'warning');
  const resultDiv = document.getElementById('patsnap-search-result');
  resultDiv.innerHTML = '<div class="loading">检索中...</div>';
  
  try {
    const resp = await fetch('/api/patsnap/search', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query})
    });
    const data = await resp.json();
    if (data.error) {
      resultDiv.innerHTML = `<div class="alert alert-warning">${data.error}</div>`;
    } else {
      resultDiv.innerHTML = renderSearchResults(data);
    }
  } catch(e) {
    resultDiv.innerHTML = `<div class="alert alert-danger">请求失败: ${e.message}</div>`;
  }
}

      resultDiv.innerHTML = `<div class="alert alert-warning">${data.error}</div>`;
    } else {
      resultDiv.innerHTML = renderLegalStatusResults(data);
    }
  } catch(e) {
    resultDiv.innerHTML = `<div class="alert alert-danger">请求失败: ${e.message}</div>`;
  }
}

// ==========================================
// 智慧芽结果渲染
// ==========================================

function formatDate(yyyymmdd) {
  if (!yyyymmdd) return '-';
  const s = String(yyyymmdd);
  return s.slice(0,4) + '-' + s.slice(4,6) + '-' + s.slice(6,8);
}

function truncate(str, len) {
  if (!str) return '-';
  return str.length > len ? str.slice(0, len) + '...' : str;
}

function renderSearchResults(data) {
  const inner = (data.data && data.data.data) ? data.data.data : data;
  const results = inner.results || [];
  const total = inner.total_search_result_count || results.length;
  if (results.length === 0) {
    return '<div class="alert alert-info">未找到相关专利，请尝试其他关键词</div>';
  }

  let html = `<div style="margin-bottom:8px;font-weight:600;font-size:14px">🔍 共找到 <span style="color:var(--primary)">${total.toLocaleString()}</span> 件相关专利，显示前 ${results.length} 条</div>`;
  
  results.forEach((r, i) => {
    const rid = 'pat_' + i;
    const bg = i % 2 === 0 ? 'var(--bg-secondary)' : 'transparent';
    const relevancy = parseFloat(r.relevancy) || 0;
    const relColor = relevancy >= 80 ? 'var(--success)' : relevancy >= 60 ? 'var(--warning)' : 'var(--text-secondary)';

    html += `<div style="background:${bg};border:1px solid var(--border);border-radius:6px;margin-bottom:8px;overflow:hidden">
      <div class="pat-row" data-target="${rid}" style="cursor:pointer;display:flex;align-items:center;padding:10px 14px;gap:12px;user-select:none;transition:background .15s"
           onmouseover="this.style.background='var(--hover-bg)'" onmouseout="this.style.background='${bg}'">
        <span style="flex:0 0 auto;font-size:11px;color:var(--text-secondary);width:22px">${i+1}</span>
        <span style="font-family:monospace;font-weight:700;font-size:14px;color:var(--primary);flex:0 0 auto;min-width:130px">${r.pn || '-'}</span>
        <span style="flex:1;font-size:13px;line-height:1.4;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(r.title||'').replace(/"/g,'&quot;')}">${r.title || '-'}</span>
        <span style="flex:0 0 auto;font-size:12px;color:var(--text-secondary);min-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(r.current_assignee||'').replace(/"/g,'&quot;')}">${truncate(r.current_assignee, 18)}</span>
        <span style="flex:0 0 auto;font-weight:600;font-size:13px;color:${relColor};min-width:42px;text-align:center">${r.relevancy || '-'}</span>
        <span style="flex:0 0 auto;font-size:11px;color:var(--text-secondary);width:18px;text-align:center">▶</span>
      </div>
      <div id="${rid}" style="display:none;padding:0 14px 14px;border-top:1px solid var(--border);background:var(--bg);font-size:13px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-top:12px">
          <div><label style="color:var(--text-secondary);font-size:11px">专利号</label><div style="font-family:monospace;font-weight:600">${r.pn || '-'}</div></div>
          <div><label style="color:var(--text-secondary);font-size:11px">申请号</label><div style="font-family:monospace">${r.apno || '-'}</div></div>
          <div><label style="color:var(--text-secondary);font-size:11px">申请日</label><div>${formatDate(r.apdt)}</div></div>
          <div><label style="color:var(--text-secondary);font-size:11px">公开日</label><div>${formatDate(r.pbdt)}</div></div>
          <div style="grid-column:1/-1"><label style="color:var(--text-secondary);font-size:11px">地址</label><div style="font-size:12px">${r.current_assignee_address || '-'}</div></div>
          <div style="grid-column:1/-1"><label style="color:var(--text-secondary);font-size:11px">发明人</label><div>${(r.inventor||'-').replace(/\|/g,' &middot; ')}</div></div>
        </div>
        <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-outline btn-sm" style="font-size:12px" onclick="event.stopPropagation();window.open('https://analytics.zhihuiya.com/patent/'+encodeURIComponent('${r.pn||''}'),'_blank')">🔗 专利号检索</button>
          <button class="btn btn-outline btn-sm" style="font-size:12px" onclick="event.stopPropagation();navigator.clipboard.writeText('${r.pn||''}');showToast('已复制: ${r.pn||''}')">📋 复制专利号</button>
          <a href="#" onclick="event.stopPropagation();event.preventDefault();document.getElementById('patsnap-patent-no').value='${r.pn||''}';window.scrollTo(0,0);return false" class="btn btn-outline btn-sm" style="font-size:12px">⚖ 查法律状态</a>
        </div>
      </div>
    </div>`;
  });

  html += `<div style="margin-top:8px;font-size:12px;color:var(--text-secondary)">💡 点击每条专利展开详情 | 数据来自智慧芽语义检索 API</div>`;
  return html;
}

// 搜索结果展开/折叠
document.addEventListener('click', function(e) {
  const row = e.target.closest('.pat-row');
  if (row) {
    const targetId = row.getAttribute('data-target');
    const detail = document.getElementById(targetId);
    if (detail) {
      const arrow = row.querySelector('span:last-child');
      if (detail.style.display === 'none') {
        detail.style.display = 'block';
        if (arrow) arrow.textContent = '▼';
      } else {
        detail.style.display = 'none';
        if (arrow) arrow.textContent = '▶';
      }
    }
  }
});

function renderImageSearchResults(data) {
  const inner = (data.data && data.data.data) ? data.data.data : data;
  const results = inner.results || [];
  const total = inner.total_search_result_count || results.length;
  if (results.length === 0) {
    return '<div class="alert alert-info">未找到匹配的外观设计专利</div>';
  }

  let html = `<div style="margin-bottom:8px;font-weight:600;font-size:14px">🖼 共找到 <span style="color:var(--primary)">${total.toLocaleString()}</span> 件外观匹配，显示前 ${results.length} 条</div>`;
  html += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">';
  html += '<thead><tr style="background:var(--bg-secondary);text-align:left">';
  html += '<th style="padding:8px">专利号</th>';
  html += '<th style="padding:8px">标题</th>';
  html += '<th style="padding:8px">专利权人</th>';
  html += '<th style="padding:8px;text-align:center">相似度</th>';
  html += '</tr></thead><tbody>';

  results.forEach((r, i) => {
    const bg = i % 2 === 0 ? 'var(--bg-secondary)' : 'transparent';
    html += `<tr style="background:${bg};border-bottom:1px solid var(--border)">
      <td style="padding:8px;font-family:monospace;white-space:nowrap"><span style="color:var(--primary);font-weight:600;cursor:pointer" onclick="event.stopPropagation();navigator.clipboard.writeText('${r.pn||''}');showToast('已复制: ${r.pn||''}')" title="点击复制">${r.pn || '-'}</span></td>
      <td style="padding:8px;line-height:1.4">${truncate(r.title, 60)}</td>
      <td style="padding:8px;font-size:12px">${truncate(r.current_assignee, 30)}</td>
      <td style="padding:8px;text-align:center;font-weight:600;color:var(--primary)">${r.relevancy || '-'}</td>
    </tr>`;
  });

  html += '</tbody></table></div>';
  return html;
}

function renderLegalStatusResults(data) {
  // data = {success: true, data: {status: true, data: [{pn, patsnap_legal_data: {inpadoc_legal_data: [...]}}]}}
  const inner = (data.data && data.data.data) ? data.data.data : data;
  const items = Array.isArray(inner) ? inner : (inner.results || []);
  
  if (items.length === 0) {
    return '<div class="alert alert-info">未找到该专利的法律状态信息</div>';
  }

  let html = '';
  items.forEach(item => {
    const legal = item.patsnap_legal_data || {};
    const inpEvents = legal.inpadoc_legal_data || [];
    const cnEvents = legal.cn_legal_data || [];
    const allEvents = [...inpEvents, ...cnEvents];
    
    html += `<div style="margin-bottom:8px;font-weight:600;font-size:14px">⚖ 专利号：<span style="font-family:monospace;color:var(--primary)">${item.pn || '-'}</span></div>`;
    
    if (allEvents.length === 0) {
      html += '<div class="alert alert-info">暂无法律事件记录</div>';
    } else {
      html += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">';
      html += '<thead><tr style="background:var(--bg-secondary);text-align:left">';
      html += '<th style="padding:8px;white-space:nowrap">事件日期</th>';
      html += '<th style="padding:8px;white-space:nowrap">事件代码</th>';
      html += '<th style="padding:8px">事件描述</th>';
      html += '</tr></thead><tbody>';

      allEvents.sort((a, b) => (b.event_date || 0) - (a.event_date || 0)).forEach((evt, i) => {
        const bg = i % 2 === 0 ? 'var(--bg-secondary)' : 'transparent';
        html += `<tr style="background:${bg};border-bottom:1px solid var(--border)">
          <td style="padding:8px;white-space:nowrap;font-size:12px">${formatDate(evt.event_date)}</td>
          <td style="padding:8px;font-family:monospace;font-size:12px">${evt.event_code || '-'}</td>
          <td style="padding:8px;font-size:12px">${truncate(evt.event_desc, 80)}</td>
        </tr>`;
      });

      html += '</tbody></table></div>';
    }
  });

  html += '<div style="margin-top:8px;font-size:12px;color:var(--text-secondary)">💡 以上为 INPADOC 法律事件 | 用于判断专利有效性和稳定性</div>';
  return html;
}

// ==========================================
// 初始化
// ==========================================
document.addEventListener('DOMContentLoaded', () => {
  renderPage('dashboard');
});
</script>
</body>
</html>
