name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'static/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir -p dist/css
          cp static/index.html dist/index.html
          cp static/css/style.css dist/css/style.css
          # Fix CSS path for GitHub Pages subpath
          sed -i 's|/static/css/style.css|css/style.css|g' dist/index.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
